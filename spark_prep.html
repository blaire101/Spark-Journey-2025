<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spark Interview Prep — Interview Ready</title>
<style>
:root{--bg:#FAFAF9;--surface:#fff;--border:#E5E5E3;--text:#1A1A18;--secondary:#57564F;--accent:#2971A8;--accent-bg:#E8F2FA;--success:#1E7A4C;--success-bg:#E4F5EC;--warn:#9A6B1E;--warn-bg:#FBF0DD;--purple:#7057A3;--purple-bg:#F1ECFA;--radius:10px}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}.app{max-width:1080px;margin:auto;padding:24px 20px 80px}header h1{font-size:23px;margin:0 0 4px}header p{font-size:13.5px;color:var(--secondary);margin:0 0 16px}.voice-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:18px;position:sticky;top:8px;z-index:20}.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:66px;background:var(--bg);z-index:15}.tab-btn{padding:9px 13px;font-size:12.5px;font-weight:600;color:var(--secondary);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}.panel{display:none}.panel.active{display:block}.intro,.head{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:16px;align-items:start}.intro{background:var(--accent-bg);color:var(--accent);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}.title{font-size:14.5px;font-weight:700;margin:0}.desc{font-size:13px;color:var(--secondary);margin:4px 0 8px}.listen{justify-self:end;min-width:96px;border:1px solid var(--accent);background:var(--accent-bg);color:var(--accent);border-radius:999px;padding:6px 10px;cursor:pointer;font-weight:600}.listen.speaking{background:var(--accent);color:#fff}.flow{font-family:Menlo,monospace;font-size:12px;background:var(--purple-bg);color:var(--purple);border-radius:8px;padding:9px 12px;margin:8px 0}.code{white-space:pre;overflow:auto;background:#F4F4F2;border-radius:8px;padding:11px 14px;font-family:Menlo,monospace;font-size:11.5px}.tip,.warn{font-size:12px;border-radius:6px;padding:7px 10px;margin-top:8px}.tip{color:var(--success);background:var(--success-bg)}.warn{color:var(--warn);background:var(--warn-bg)}table{border-collapse:collapse;width:100%;font-size:12px;margin:8px 0;display:block;overflow:auto}th,td{border:1px solid var(--border);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--accent-bg);color:var(--accent)}.qa{font-size:13px;color:var(--secondary);border-left:3px solid var(--accent);padding-left:12px;margin-top:5px}@media(max-width:700px){.intro,.head{grid-template-columns:1fr}.listen{justify-self:start}.tabs{top:108px}}
</style></head><body><div class="app"><header><h1>Spark Interview Prep</h1><p>Core concepts, execution model, skew handling, optimization, and production troubleshooting — with English read-aloud practice.</p></header>
<div class="voice-bar"><label>🔊 Voice: <select id="voice"></select></label><label>Speed: <input id="rate" type="range" min="0.7" max="1.2" step="0.05" value="0.92"></label><span id="rv">0.92x</span><button id="stop" class="listen" style="margin-left:auto">⏹ Stop</button></div>
<div class="tabs"><button class="tab-btn active" data-tab="core">🧠 Core</button><button class="tab-btn" data-tab="exec">⚙️ Execution</button><button class="tab-btn" data-tab="catalyst">🧩 Catalyst</button><button class="tab-btn" data-tab="shuffle">🔀 Shuffle & Skew</button><button class="tab-btn" data-tab="opt">🧂 Skew Optimization</button><button class="tab-btn" data-tab="aqe">🚀 AQE & Joins</button><button class="tab-btn" data-tab="quick">⚡ Quick Answers</button><button class="tab-btn" data-tab="deep">🔍 Deep-Dive Q&A</button></div><div id="core" class="panel active"></div><div id="exec" class="panel"></div><div id="catalyst" class="panel"></div><div id="shuffle" class="panel"></div><div id="opt" class="panel"></div><div id="aqe" class="panel"></div><div id="quick" class="panel"></div><div id="deep" class="panel"></div></div>
<script>
const data={"core": [{"title": "What is Apache Spark?", "speak": "Apache Spark is a distributed computing engine for large-scale data processing. It uses DAG-based execution and can keep reusable intermediate data in memory, which makes many iterative workloads faster than traditional MapReduce.", "desc": "A concise definition that highlights distribution, DAG execution, and in-memory processing.", "table": [["Capability", "Meaning"], ["Distributed engine", "Runs tasks across multiple worker nodes"], ["In-memory processing", "Can cache reusable data across stages"], ["DAG-based", "Optimizes multiple transformations as one execution graph"], ["APIs", "Python, Scala, Java, and SQL"]]}, {"title": "RDD", "speak": "An RDD is an immutable, partitioned, distributed collection and the low-level Spark API. It supports transformations such as map and filter, and key-based operations such as reduce by key.", "desc": "RDD stands for Resilient Distributed Dataset.", "tip": "RDDs provide control, but DataFrames usually offer better optimization and performance."}, {"title": "DataFrame", "speak": "A DataFrame is a distributed table with a schema. It is optimized by Catalyst and Tungsten, making it easier to use and generally faster than raw RDD code.", "desc": "Think of it as a distributed, optimized table rather than simply distributed Pandas."}, {"title": "Lazy Evaluation", "speak": "Spark records transformations and builds a DAG, but it does not execute them immediately. Execution begins only when an action such as count, collect, show, or save is called.", "desc": "Lazy evaluation allows Spark to optimize the whole pipeline before execution.", "flow": "Transformations → Logical DAG → Action → Execution"}, {"title": "Transformation vs Action", "speak": "A transformation lazily creates a new RDD or DataFrame, while an action triggers actual computation and returns or writes a result.", "desc": "This distinction explains when Spark actually starts a job.", "code": "Transformations: map, filter, select, groupBy\nActions:         count, collect, show, save"}], "exec": [{"title": "Job → Stage → Task", "speak": "An action triggers a job. The DAG scheduler splits the job into stages at shuffle boundaries. Each stage contains tasks, and each task processes one partition.", "desc": "The core execution hierarchy.", "flow": "Action → Job → Stage → Task → Executor", "table": [["Concept", "One-Line Answer", "Key Point"], ["Job", "Triggered by an action", "One action normally creates one job"], ["Stage", "Tasks between shuffle boundaries", "Wide transformations split stages"], ["Task", "Execution unit for one partition", "One partition equals one task"], ["Executor", "Runs tasks on worker nodes", "Parallelism is limited by executor cores"]]}, {"title": "Driver, DAGScheduler, and TaskScheduler", "speak": "The driver runs the application logic and coordinates execution. The DAG scheduler converts the DAG into stages, while the task scheduler assigns tasks to executors and manages retries and data locality.", "desc": "Know which component is responsible for planning versus task placement.", "code": "Driver        — runs main logic and coordinates the application\nDAGScheduler   — splits jobs into stages at shuffle boundaries\nTaskScheduler  — assigns tasks to executors and manages retries\nExecutor       — executes tasks and stores cached or shuffle data"}, {"title": "Input Partitions vs Shuffle Partitions", "speak": "Initial partitions are mainly determined by the data source, file layout, block size, and split settings. Spark SQL shuffle partitions controls the number of output partitions after shuffle operations such as joins and aggregations.", "desc": "Do not confuse file-read parallelism with post-shuffle parallelism.", "flow": "Read partitions ≠ spark.sql.shuffle.partitions", "table": [["Phase", "Partition Control"], ["File read", "Source splits, block size, file format, max partition bytes"], ["Narrow transformations", "Usually preserve or locally transform existing partitions"], ["Shuffle output", "spark.sql.shuffle.partitions, unless AQE changes it at runtime"]]}], "catalyst": [{"title": "Catalyst Optimizer Pipeline", "speak": "Catalyst parses SQL or DataFrame code into a logical plan, resolves columns and types into an analyzed plan, applies optimization rules to create an optimized plan, and then selects physical operators for execution.", "desc": "The four stages to remember.", "flow": "Logical Plan → Analyzed Plan → Optimized Plan → Physical Plan", "table": [["Stage", "What Happens"], ["Logical Plan", "Parse SQL or DataFrame operations into an unresolved tree"], ["Analyzed Plan", "Resolve columns, tables, functions, and data types"], ["Optimized Plan", "Apply predicate pushdown, column pruning, constant folding, and join reordering"], ["Physical Plan", "Choose operators such as BroadcastHashJoin, SortMergeJoin, HashAggregate, or SortAggregate"]]}, {"title": "Common Catalyst Optimizations", "speak": "Predicate pushdown filters data as early as possible, column pruning reads only required columns, constant folding precomputes constant expressions, and join reordering selects a more efficient join order.", "desc": "Mention these when explaining why DataFrame and SQL workloads are usually preferred.", "code": "Predicate Pushdown — reduce rows early\nColumn Pruning    — read only required columns\nConstant Folding  — precompute constant expressions\nJoin Reordering   — choose a more efficient join order"}, {"title": "How to Inspect the Plan", "speak": "Use explain to inspect logical and physical plans. Focus on expensive operators such as exchanges, sort merge joins, hash aggregates, and large scans.", "desc": "Execution plans connect SQL logic with runtime behavior.", "code": "df.explain(\"formatted\")\n\n-- SQL\nEXPLAIN FORMATTED\nSELECT ..."}], "shuffle": [{"title": "What is Shuffle?", "speak": "Shuffle is the redistribution of data across partitions. It is expensive because it involves serialization, network transfer, disk writes, and disk reads.", "desc": "Shuffle is often the main performance boundary in Spark.", "table": [["Type", "Relationship", "Examples"], ["Narrow transformation", "Each parent partition contributes to one child partition", "map, filter, union"], ["Wide transformation", "Parent partitions contribute to multiple child partitions", "groupBy, join, reduceByKey"]], "tip": "If records must move to a different partition based on key, a shuffle is required."}, {"title": "What is Data Skew?", "speak": "Data skew means records are distributed unevenly across partitions. A hot key can create one extremely large partition, causing long-tail tasks, spills, garbage collection pressure, or executor out-of-memory errors.", "desc": "Skew is a data-distribution problem, not merely a resource-allocation problem.", "table": [["Skew Type", "Cause", "Common Solution"], ["Input files", "Many tiny files or one oversized file", "Compaction, repartitioning, better file sizing"], ["Join keys", "A hot key appears millions of times", "Broadcast join, salting, AQE skew join handling"], ["Aggregation keys", "One key dominates GROUP BY", "Two-stage aggregation and targeted salting"], ["General imbalance", "Uneven partition sizes", "AQE and shuffle-partition tuning"]], "table2": [["Symptom", "Likely Meaning"], ["One task runs much longer", "Hot partition or skew"], ["Executor OOM", "Oversized aggregation or join state"], ["High shuffle read time", "Network and disk I/O bottleneck"], ["Long GC pauses", "Memory pressure"]]}, {"title": "Why Shuffle Read Becomes the Bottleneck", "speak": "Reduce-side tasks fetch shuffle files written by map-side tasks. Under skew, one reducer may fetch far more data than the others, so shuffle read time dominates while CPU utilization remains relatively low.", "desc": "This explains why the job can be slow even when the computation itself is simple.", "tip": "Compare shuffle read time, task CPU time, partition size, spill metrics, and task-duration distribution in the Spark UI."}], "opt": [{"title": "Two-Stage Aggregation", "speak": "Two-stage aggregation first reduces cardinality or deduplicates at a finer-grained key, and then performs the final aggregation. This replaces one giant aggregation state with many smaller and more manageable groups.", "desc": "Especially useful for skewed count distinct or high-cardinality aggregation.", "table": [["", "Single-Stage", "Two-Stage"], ["Memory model", "One giant HashSet per hot group", "Many smaller groups"], ["Spill behavior", "Often difficult for exact distinct state", "More manageable intermediate groups"], ["OOM risk", "High under extreme skew", "Lower"], ["Operational behavior", "Fast on small balanced data", "Stable on large skewed data"]], "code": "-- Stage 1: deduplicate the distinct key\nSELECT key, sender_id\nFROM source\nGROUP BY key, sender_id;\n\n-- Stage 2: count deduplicated rows\nSELECT key, COUNT(*)\nFROM stage1\nGROUP BY key;", "tip": "Production example: combined with targeted salting and AQE, runtime improved from 75 minutes to 13 minutes."}, {"title": "Salting for Skewed Aggregation", "speak": "For a skewed aggregation, add a deterministic salt derived from the distinct key, distribute the hot key across several reducers, aggregate within each bucket, and then merge the partial results.", "desc": "Deterministic salting preserves distinct semantics.", "code": "salt = hash(sender_id) % 8\n\nStage 1: GROUP BY key, salt, sender_id\nStage 2: GROUP BY key, sender_id\nStage 3: GROUP BY key → COUNT(*)", "warn": "For COUNT DISTINCT, do not use a different random salt for duplicate copies of the same distinct value, or the final count can be wrong."}, {"title": "Salting for a Skewed Join", "speak": "For join skew, assign each large-table row to a salt bucket and replicate the matching small-table rows across all salt values. Join on the salted key, then remove the salt after the join.", "desc": "The small side is expanded so every large-side bucket has a matching key.", "code": "WITH salted_large AS (\n  SELECT CONCAT(CAST(FLOOR(RAND() * 10) AS STRING), '_', join_key) AS salted_key,\n         some_value\n  FROM large_table\n),\nsalt_values AS (\n  SELECT 0 AS salt UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3\n  UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6\n  UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9\n),\nsalted_small AS (\n  SELECT CONCAT(CAST(s.salt AS STRING), '_', t.join_key) AS salted_key,\n         t.other_value\n  FROM small_table t\n  CROSS JOIN salt_values s\n)\nSELECT *\nFROM salted_large l\nJOIN salted_small r ON l.salted_key = r.salted_key;", "tip": "Random salting can be valid for join distribution because each large-side row belongs to one bucket and the small side is replicated across all buckets."}, {"title": "HashAggregate vs SortAggregate", "speak": "Hash aggregate is usually faster when aggregation state fits in memory, but it can create high memory pressure. Sort aggregate is more stable for large or skewed workloads because sorted data and spill behavior can reduce peak memory pressure.", "desc": "Use the execution plan and runtime metrics to understand which operator Spark selected.", "table": [["", "HashAggregate", "SortAggregate"], ["Primary structure", "In-memory hash map or hash set", "Sorted stream of grouped rows"], ["Memory pressure", "Potentially high", "Typically more controlled"], ["Performance", "Fast when state fits in memory", "More stable for large or skewed groups"], ["Risk", "OOM under extreme cardinality or skew", "Extra sort and spill overhead"]]}], "aqe": [{"title": "AQE — Adaptive Query Execution", "speak": "Adaptive Query Execution uses runtime statistics to coalesce small shuffle partitions, split skewed join partitions, and change join strategies when the actual data size differs from the original estimate.", "desc": "AQE improves plans after shuffle statistics become available.", "table": [["AQE Function", "What It Does", "Benefit"], ["Coalesce partitions", "Merges small shuffle partitions", "Reduces tiny-task overhead"], ["Skew join split", "Splits oversized join partitions", "Reduces long-tail tasks"], ["Switch join strategy", "Can change SortMergeJoin to BroadcastHashJoin", "Avoids unnecessary shuffle"]], "warn": "AQE cannot always solve one extreme hot key in an aggregation. Manual salting or query redesign may still be necessary."}, {"title": "AQE vs Manual Salting", "speak": "AQE is automatic and reacts at runtime, while manual salting rewrites the data distribution before the shuffle. AQE works well for moderate skew, but known extreme keys often require targeted salting.", "desc": "Use both when necessary; they solve skew at different stages.", "table": [["", "AQE", "Salting"], ["Timing", "Runtime, after statistics are available", "Before or during logical query rewrite"], ["Implementation", "Automatic", "Manual"], ["Best for", "Moderate or unpredictable skew", "Known extreme hot keys"], ["Main limitation", "May not rebalance one extreme aggregation key", "Requires careful correctness design"]]}, {"title": "Join Strategies", "speak": "Broadcast hash join sends a small table to every executor and avoids shuffling the large table. Sort merge join shuffles and sorts both large sides. Shuffle hash join shuffles both sides and builds an in-memory hash table for the smaller side of each partition.", "desc": "Choose the strategy based on data size, memory, and statistics.", "table": [["Strategy", "When to Use", "How It Works"], ["BroadcastHashJoin", "One side is small enough to broadcast", "Replicate small side; avoid large-side shuffle"], ["SortMergeJoin", "Both sides are large and sortable", "Shuffle and sort both sides, then merge"], ["ShuffleHashJoin", "Smaller partitioned side fits in memory", "Shuffle both sides, hash the smaller side"]], "tip": "The 10 MB broadcast threshold is only a common default; always check your Spark version and configuration."}], "quick": [["What is Spark?", "A distributed, DAG-based computing engine for large-scale data processing, with in-memory caching support."], ["What is shuffle?", "Data redistribution across partitions. It is expensive because of serialization, network transfer, and disk I/O."], ["What is data skew?", "Uneven data distribution across partitions, causing long-tail tasks, spills, or executor OOM."], ["How did you solve skew?", "I used two-stage aggregation, targeted salting, and AQE, reducing runtime from 75 minutes to 13 minutes."], ["What is AQE?", "Runtime optimization that coalesces small shuffle partitions, handles skewed joins, and can switch join strategies."], ["HashAgg vs SortAgg?", "HashAgg is fast when state fits in memory; SortAgg is usually more stable for large or skewed groups."], ["What is lazy evaluation?", "Transformations build a DAG, and execution starts only when an action is called."], ["What is Catalyst?", "Spark SQL's optimizer, converting a logical plan into an optimized physical execution plan."], ["What is one partition?", "A logical data slice processed by one task at a time."], ["Why is shuffle read high under skew?", "One reducer fetches a disproportionate amount of shuffle data, making network and disk I/O the bottleneck."]], "deep": [{"title": "Q1: What determines the number of partitions after Spark reads data?", "speak": "The initial partition count mainly depends on the data source, file size, block size, file splits, and reader settings. Spark SQL shuffle partitions applies after wide operations such as joins and aggregations, not to the initial file read.", "desc": "Use this answer to separate input parallelism from shuffle parallelism.", "table": [["Phase", "Partition Control"], ["File read", "Source splits, block size, file format, max partition bytes"], ["Narrow transformations", "Usually preserve or locally transform existing partitions"], ["Shuffle output", "spark.sql.shuffle.partitions, unless AQE changes it at runtime"]]}, {"title": "Q2: Is setting spark.sql.shuffle.partitions to 200 meaningful?", "speak": "It can be meaningful, but only in context. Two hundred may be too high for a small dataset and too low for a large shuffle. Choose a value based on shuffle size, target partition size, available executor cores, and AQE behavior.", "desc": "Avoid treating 200 as a universally correct value.", "tip": "A practical goal is enough partitions to use available cores without creating thousands of tiny tasks."}, {"title": "Q3: Spark vs MapReduce", "speak": "Spark supports DAG execution and can cache intermediate data in memory across repeated operations. MapReduce uses a fixed map and reduce model and typically writes intermediate results to disk between jobs.", "desc": "Emphasize workload pattern rather than claiming Spark is always faster.", "table": [["Aspect", "Spark", "MapReduce"], ["Execution model", "DAG of multiple stages", "Fixed map and reduce phases per job"], ["Intermediate data", "Can remain cached in memory", "Typically materialized to disk between jobs"], ["Best fit", "Iterative analytics, SQL, streaming, machine learning", "Large batch workflows with simple map-reduce patterns"], ["Fault tolerance", "Lineage and task recomputation", "Task retry using materialized intermediate data"]]}, {"title": "Q4: How do you troubleshoot Spark performance problems?", "speak": "I start with the Spark UI to locate the slow job and stage, inspect task-duration distribution and shuffle metrics, review the SQL and DAG, examine the physical plan with explain, and then query the underlying data to confirm skewed keys or abnormal cardinality.", "desc": "A structured production troubleshooting method.", "table": [["Step", "What to Inspect"], ["1. Spark UI", "Slow jobs, stages, long-tail tasks"], ["2. Stage metrics", "Shuffle read and write, spills, GC, input size"], ["3. SQL and DAG", "Wide transformations and repeated scans"], ["4. Physical plan", "Exchange, HashAggregate, SortAggregate, SortMergeJoin"], ["5. Data profile", "Hot keys, null-heavy keys, high cardinality, file-size imbalance"]], "tip": "Always distinguish data problems, query-plan problems, and resource problems before changing executor memory."}, {"title": "Q5: How do you explain your production skew incident?", "speak": "A critical aggregation job suffered executor out-of-memory failures and a 75-minute runtime because one hot key created an oversized aggregation state. I confirmed the skew through Spark UI task metrics and key-frequency analysis, then applied two-stage aggregation, targeted deterministic salting, and AQE. Runtime dropped to 13 minutes and the job became stable.", "desc": "A concise STAR-style technical story.", "flow": "Symptom → Spark UI → Root Cause → Query Rewrite → Validation → 75 min to 13 min"}, {"title": "Q6: When should you broadcast a table?", "speak": "Broadcast a table when it is small enough to fit safely in executor memory and broadcasting it avoids a much larger shuffle. Validate the actual size, memory headroom, and number of concurrent tasks rather than relying only on row count.", "desc": "Mention memory safety and statistics, not only the default threshold."}]};
const intros={core:"Use these concise definitions to establish strong foundations before moving into execution and optimization.",exec:"Remember the hierarchy: an action creates a job, a job is split into stages, and each stage runs tasks over partitions.",catalyst:"Catalyst transforms SQL or DataFrame code into an optimized physical execution plan before Spark runs the query.",shuffle:"Shuffle and skew are the most common causes of long-tail tasks, high network I/O, spills, and executor out-of-memory failures.",opt:"These techniques are most useful when a single hot key creates an unspillable or oversized aggregation state.",aqe:"AQE adapts at runtime, while join strategy selection determines how much data is shuffled and stored in executor memory.",quick:"Use the first sentence as your interview opening answer, then expand only when the interviewer asks for details.",deep:"These answers demonstrate troubleshooting structure, production judgment, and an understanding of Spark internals."};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const btn=t=>`<button class="listen" data-speak="${encodeURIComponent(t)}">🔊 Listen</button>`;
function tbl(rows){return '<table><thead><tr>'+rows[0].map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+r.map(x=>`<td>${x}</td>`).join('')+'</tr>').join('')+'</tbody></table>'}
function card(x){let h=`<div class="card"><div class="head"><p class="title">${x.title}</p>${btn(x.speak)}</div><p class="desc">${x.speak}</p>`;if(x.desc)h+=`<p class="desc">${x.desc}</p>`;if(x.flow)h+=`<div class="flow">${x.flow}</div>`;if(x.table)h+=tbl(x.table);if(x.table2)h+=tbl(x.table2);if(x.code)h+=`<div class="code">${esc(x.code)}</div>`;if(x.tip)h+=`<div class="tip">💡 ${x.tip}</div>`;if(x.warn)h+=`<div class="warn">⚠️ ${x.warn}</div>`;return h+'</div>'}
function intro(id){return `<div class="intro"><div>${intros[id]}</div>${btn(intros[id])}</div>`}
for(const id of ['core','exec','catalyst','shuffle','opt','aqe','deep'])document.getElementById(id).innerHTML=intro(id)+data[id].map(card).join('');
document.getElementById('quick').innerHTML=intro('quick')+data.quick.map(([q,a])=>`<div class="card"><div class="head"><p class="title">${q}</p>${btn(a)}</div><div class="qa">${a}</div></div>`).join('');
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});
let voices=[],active=null;const synth=speechSynthesis,sel=document.getElementById('voice'),rate=document.getElementById('rate'),rv=document.getElementById('rv');function load(){voices=synth.getVoices().filter(v=>v.lang.toLowerCase().startsWith('en'));sel.innerHTML='';voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${v.name} (${v.lang})`;sel.appendChild(o)});let i=voices.findIndex(v=>v.name.toLowerCase()==='google uk english female');if(i<0)i=voices.findIndex(v=>v.lang.toLowerCase().startsWith('en-gb'));if(i>=0)sel.value=i}load();synth.onvoiceschanged=load;rate.oninput=()=>rv.textContent=rate.value+'x';function reset(){document.querySelectorAll('.listen.speaking').forEach(b=>b.classList.remove('speaking'));active=null}document.addEventListener('click',e=>{const b=e.target.closest('[data-speak]');if(!b)return;if(active===b){synth.cancel();reset();return}synth.cancel();reset();const u=new SpeechSynthesisUtterance(decodeURIComponent(b.dataset.speak));if(voices[sel.value])u.voice=voices[sel.value];u.lang='en-GB';u.rate=parseFloat(rate.value);u.onstart=()=>{b.classList.add('speaking');active=b};u.onend=reset;u.onerror=reset;synth.speak(u)});document.getElementById('stop').onclick=()=>{synth.cancel();reset()};
</script></body></html>
