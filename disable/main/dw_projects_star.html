<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Warehouse Projects — STAR Format</title>
<style>
  :root {
    --bg:#FAFAF9; --surface:#FFFFFF; --border:#E5E5E3; --border-strong:#D4D4D0;
    --text-primary:#1A1A18; --text-secondary:#57564F; --text-muted:#8A8985;
    --accent:#2971A8; --accent-bg:#E8F2FA;
    --success:#1E7A4C; --success-bg:#E4F5EC;
    --warning:#9A6B1E; --warning-bg:#FBF0DD;
    --danger:#B14A3F; --danger-bg:#FBECEA;
    --purple:#7B4FA0; --purple-bg:#F1E9F7;
    --radius:10px;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text-primary); line-height:1.55; }
  .app { max-width:980px; margin:0 auto; padding:24px 20px 80px; }
  header h1 { font-size:21px; font-weight:600; margin:0 0 4px; }
  header p { font-size:13.5px; color:var(--text-secondary); margin:0 0 16px; }

  .voice-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:10px 14px; margin-bottom:18px; font-size:13px; color:var(--text-secondary); }
  .voice-bar select { font-size:13px; padding:4px 8px; border-radius:6px; border:1px solid var(--border-strong); }
  .voice-bar input[type=range] { width:100px; }

  .tabs { display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--border); overflow-x:auto; }
  .tab-btn { padding:10px 14px; font-size:13px; font-weight:600; color:var(--text-secondary); background:none; border:none; border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap; }
  .tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  .project-header {
    font-size:13px; color:var(--text-secondary); background:var(--accent-bg);
    border-radius:var(--radius); padding:12px 16px; margin-bottom:16px;
  }
  .project-header b { color:var(--text-primary); }

  .star-banner {
    display:flex; align-items:center; gap:10px; font-size:13px; font-weight:700;
    padding:10px 14px; border-radius:var(--radius); margin:20px 0 12px;
  }
  .star-banner:first-of-type { margin-top:0; }
  .star-banner.S { background:var(--purple-bg); color:var(--purple); }
  .star-banner.T { background:var(--accent-bg); color:var(--accent); }
  .star-banner.A { background:var(--warning-bg); color:var(--warning); }
  .star-banner.R { background:var(--success-bg); color:var(--success); }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; }
  .q-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px; }
  .q-title { font-size:14px; font-weight:600; margin:0; }
  .q-desc { font-size:13.5px; color:var(--text-secondary); margin:4px 0 0; }

  table.datatbl { border-collapse:collapse; font-size:12px; margin:8px 0 4px; width:100%; overflow-x:auto; display:block; }
  table.datatbl th, table.datatbl td { border:1px solid var(--border); padding:5px 9px; text-align:left; vertical-align:top; }
  table.datatbl th { background:var(--accent-bg); color:var(--accent); font-weight:600; }

  .flow { font-family:"SF Mono",Menlo,monospace; font-size:12px; background:var(--accent-bg); color:var(--accent); border-radius:8px; padding:8px 12px; margin:8px 0; }
  .anchor { font-family:"SF Mono",Menlo,monospace; font-size:11.5px; background:#F4F4F2; border-radius:8px; padding:10px 14px; margin:8px 0; white-space:pre; color:var(--text-primary); }
  .tip { font-size:12px; color:var(--success); background:var(--success-bg); border-radius:6px; padding:6px 10px; margin-top:8px; }

  .listen-btn { flex-shrink:0; display:flex; align-items:center; gap:6px; font-size:12px; font-weight:500; padding:5px 10px; border-radius:999px; border:1px solid var(--accent); background:var(--accent-bg); color:var(--accent); cursor:pointer; }
  .listen-btn.speaking { background:var(--accent); color:white; }
  .listen-btn svg { width:12px; height:12px; }


  /* Data Warehouse Fundamentals */
  .dw-intro { background:linear-gradient(135deg,var(--accent-bg),#F6FAFD); border:1px solid #CFE3F3; border-radius:var(--radius); padding:14px 16px; margin-bottom:14px; }
  .dw-intro h2 { font-size:17px; margin:0 0 5px; color:var(--accent); }
  .dw-intro p { margin:0; font-size:13px; color:var(--text-secondary); }
  .dw-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .dw-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; }
  .dw-card.full { grid-column:1/-1; }
  .dw-card h3 { font-size:14px; margin:0; }
  .dw-card p { font-size:13px; color:var(--text-secondary); margin:6px 0 8px; }
  .dw-cn { color:var(--text-muted) !important; font-size:12px !important; }
  .case-section-title { font-size:16px; font-weight:700; color:var(--purple); margin:22px 0 10px; }
  .case-intro { background:var(--accent-bg); border:1px solid #cfe3f3; border-radius:var(--radius); padding:12px 14px; margin-bottom:14px; font-size:13px; color:var(--text-secondary); }
  .domain-code { font-family:"SF Mono",Menlo,monospace; font-weight:700; color:var(--accent); }

  .dw-key { font-weight:700; color:#173F5F; }
  .dw-code { white-space:pre-wrap; overflow:auto; background:#111827; color:#E5E7EB; border-radius:8px; padding:11px 14px; font-family:"SF Mono",Menlo,monospace; font-size:11.5px; line-height:1.55; }
  .dw-qa { border-left:3px solid var(--accent); padding-left:12px; margin:8px 0; }
  .schema-visual { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; margin:10px 0; }
  .schema-box { border:1px solid var(--border); border-radius:9px; padding:12px; background:#fff; text-align:center; font-size:12px; }
  .schema-box.fact { background:var(--warning-bg); color:var(--warning); border-color:#E8D1A8; font-weight:700; }
  .schema-box.dim { background:var(--accent-bg); color:var(--accent); border-color:#CFE3F3; }
  .schema-arrow { color:var(--text-muted); font-weight:700; }
  @media(max-width:720px){ .dw-grid{grid-template-columns:1fr}.schema-visual{grid-template-columns:1fr}.schema-arrow{transform:rotate(90deg)} }


  /* DW & DG tab imported from behavioral prep */
  .a-text { font-size:13.5px; color:var(--text-secondary); margin:6px 0 0; }
  .a-text b { color:var(--text-primary); }
  .star-label { font-weight:700; color:var(--accent); }
  .dwdg-intro { background:linear-gradient(135deg,var(--purple-bg),#FBF9FD); border:1px solid #DED2E8; border-radius:var(--radius); padding:14px 16px; margin-bottom:14px; }
  .dwdg-intro h2 { font-size:17px; margin:0 0 5px; color:var(--purple); }
  .dwdg-intro p { margin:0; color:var(--text-secondary); font-size:13px; }
  .hourglass-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:14px; overflow:auto; }
  .hourglass-wrap svg { width:100%; min-width:720px; height:auto; display:block; }
  .diagram-caption { font-size:12px; color:var(--text-muted); margin-top:8px; text-align:center; }


  .cell-listen-wrap { display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }
  .cell-listen-text { min-width:0; flex:1; }
  .cell-listen-btn { flex:0 0 auto; width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; border-radius:999px; border:1px solid var(--accent); background:var(--accent-bg); color:var(--accent); cursor:pointer; padding:0; }
  .cell-listen-btn.speaking { background:var(--accent); color:#fff; }
  .cell-listen-btn svg { width:11px; height:11px; }
  .shift-card { border-left:5px solid var(--purple); background:linear-gradient(135deg,#fff,var(--purple-bg)); }
  .shift-flow { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; margin:10px 0 12px; }
  .shift-box { border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:#fff; }
  .shift-box h4 { margin:0 0 5px; font-size:13px; }
  .shift-box p { margin:0; font-size:12.5px; color:var(--text-secondary); }
  .shift-arrow { font-size:22px; color:var(--purple); font-weight:700; }
  @media(max-width:720px){ .shift-flow{grid-template-columns:1fr}.shift-arrow{transform:rotate(90deg);text-align:center} }


  .listen-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin:7px 0;
  }
  .listen-row .q-desc,
  .listen-row .dw-qa-text{
    margin:0;
    flex:1;
    min-width:0;
  }
  .dm-design-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;
    margin:10px 0 12px;
  }
  .dm-design-box{
    border:1px solid var(--border);
    border-radius:9px;
    padding:11px 12px;
    background:#fff;
  }
  .dm-design-box h4{
    margin:0 0 5px;
    font-size:13px;
    color:var(--accent);
  }
  .dm-design-box p{
    margin:0;
    font-size:12.5px;
    color:var(--text-secondary);
  }
  .metric-type{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    padding:9px 10px;
    margin:7px 0;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
  }
  .metric-type-text{flex:1;min-width:0;font-size:12.8px;color:var(--text-secondary)}
  .table-intro{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:8px 0 6px;padding:8px 10px;border-radius:8px;background:#F7F9FB;border:1px solid var(--border)}
  .table-intro p{margin:0!important;flex:1;color:var(--text-secondary);font-size:12.8px}
  .qa-listen-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .qa-listen-row .qa-copy{flex:1;min-width:0}
  @media(max-width:720px){
    .dm-design-grid{grid-template-columns:1fr}
  }



  /* Fast interview storytelling */
  .quick-story{background:linear-gradient(135deg,#F6FAFD,#FFFFFF);border:1px solid #BFD9EC;border-left:5px solid var(--accent);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
  .quick-story-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:7px}
  .quick-story h3{font-size:15px;margin:0;color:#173F5F}
  .quick-story p{font-size:13.5px;color:var(--text-secondary);margin:0;line-height:1.65}
  .quick-points{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:10px 0 2px}
  .quick-point{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 9px;font-size:11.8px;color:var(--text-secondary)}
  .quick-point b{display:block;color:var(--accent);font-size:11.5px;margin-bottom:3px}
  details.project-details{margin-top:10px}
  details.project-details>summary{cursor:pointer;list-style:none;background:#fff;border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:700;color:var(--text-secondary)}
  details.project-details>summary::-webkit-details-marker{display:none}
  details.project-details>summary:before{content:'＋ ';color:var(--accent)}
  details.project-details[open]>summary:before{content:'－ '}
  .details-content{margin-top:12px}
  @media(max-width:800px){.quick-points{grid-template-columns:1fr 1fr}.quick-points .quick-point:last-child{grid-column:1/-1}}

</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Data Warehouse Projects — STAR Format</h1>
    <p>4 projects, each structured as Situation → Task → Action → Result, with English read-aloud practice</p>
  </header>

  <div class="voice-bar">
    <label>🔊 Voice: <select id="voiceSelect"></select></label>
    <label>Speed: <input type="range" id="rateSlider" min="0.7" max="1.2" step="0.05" value="0.92"></label>
    <span id="rateLabel">0.92x</span>
    <button class="listen-btn" id="stopAllBtn" style="margin-left:auto">⏹ Stop</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="dwfund">🏛️ DW Fundamentals</button>
    <button class="tab-btn" data-tab="dwdg">🏗️ DW &amp; DG</button>
    <button class="tab-btn" data-tab="amazon">📦 Amazon Collection</button>
    <button class="tab-btn" data-tab="gov">🛡️ Data Governance</button>
    <button class="tab-btn" data-tab="reserve">🎯 Reservation Mart</button>
    <button class="tab-btn" data-tab="toc">🌍 ToC Remittance</button>
  </div>

  <div id="dwfund" class="tab-panel active"></div>
  <div id="dwdg" class="tab-panel"></div>
  <div id="amazon" class="tab-panel"></div>
  <div id="gov" class="tab-panel"></div>
  <div id="reserve" class="tab-panel"></div>
  <div id="toc" class="tab-panel"></div>
</div>

<script>
const speakIcon = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
function listenBtn(text, big) { return `<button class="listen-btn${big?' big':''}" data-action="speak" data-text="${encodeURIComponent(text)}">${speakIcon}Listen</button>`; }
function table(headers, rows) {
  let html = '<table class="datatbl"><thead><tr>' + headers.map(h=>`<th>${h}</th>`).join('') + '</tr></thead><tbody>';
  rows.forEach(r => { html += '<tr>' + r.map(c=>`<td>${c}</td>`).join('') + '</tr>'; });
  html += '</tbody></table>';
  return html;
}

function plainEnglishText(html) {
  const temp = document.createElement('div');
  temp.innerHTML = String(html || '');
  temp.querySelectorAll('.dw-cn').forEach(el => el.remove());
  return temp.textContent.replace(/\s+/g, ' ').trim();
}

function enhanceDwFundamentalTables() {
  const root = document.getElementById('dwfund');
  if (!root) return;
  root.querySelectorAll('table.datatbl th, table.datatbl td').forEach(cell => {
    if (cell.querySelector('.cell-listen-wrap')) return;
    const original = cell.innerHTML;
    const speakText = plainEnglishText(original);
    if (!speakText) return;
    cell.innerHTML = `
      <div class="cell-listen-wrap">
        <div class="cell-listen-text">${original}</div>
        <button class="cell-listen-btn" data-action="speak" data-text="${encodeURIComponent(speakText)}" aria-label="Listen to this table cell" title="Listen">
          ${speakIcon}
        </button>
      </div>`;
  });
}

function enhanceKnowledgeTables() {
  document.querySelectorAll('table.datatbl').forEach(tbl => {
    if (tbl.closest('.no-cell-listen')) return;
    tbl.querySelectorAll('th, td').forEach(cell => {
      if (cell.querySelector('.cell-listen-wrap')) return;
      const original = cell.innerHTML;
      const speakText = plainEnglishText(original);
      if (!speakText) return;
      cell.innerHTML = `
        <div class="cell-listen-wrap">
          <div class="cell-listen-text">${original}</div>
          <button class="cell-listen-btn" data-action="speak" data-text="${encodeURIComponent(speakText)}" aria-label="Listen to this table cell" title="Listen">
            ${speakIcon}
          </button>
        </div>`;
    });
  });
}


function flowDiagram(steps) {
  const boxW = 600, boxH = 46, gap = 34, padTop = 30, padBottom = 20;
  const totalH = steps.length * (boxH + gap) - gap + padTop + padBottom;
  const x = 40;
  let svg = `<svg width="100%" viewBox="0 0 680 ${totalH}" style="max-width:640px; display:block; margin:8px auto;">
    <defs>
      <marker id="fmarker" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
      </marker>
    </defs>`;
  steps.forEach((step, i) => {
    const y = padTop + i * (boxH + gap);
    const isFirst = i === 0;
    const isLast = i === steps.length - 1;
    const fc = isFirst ? 'var(--purple-bg)' : isLast ? 'var(--success-bg)' : 'var(--accent-bg)';
    const stroke = isFirst ? 'var(--purple)' : isLast ? 'var(--success)' : 'var(--accent)';
    svg += `<rect x="${x}" y="${y}" width="${boxW}" height="${boxH}" rx="8" fill="${fc}" stroke="${stroke}" stroke-width="1"/>
      <text x="${x + boxW/2}" y="${y + boxH/2}" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="${stroke}">${i+1}. ${step}</text>`;
    if (!isLast) {
      const ay1 = y + boxH, ay2 = y + boxH + gap;
      svg += `<line x1="${x + boxW/2}" y1="${ay1}" x2="${x + boxW/2}" y2="${ay2}" stroke="#888" stroke-width="1.5" marker-end="url(#fmarker)"/>`;
    }
  });
  svg += `</svg>`;
  return svg;
}

// ============================================================
// PROJECT DATA — each project is an array of STAR cards
// ============================================================

const projects = {

  amazon: {
    header: `<b>Amazon Standard Collection</b> — cross-border e-commerce fund collection using a Virtual Account (VA) model`,
    introHtml: `
      <div class="case-section-title">1. Development Process</div>
      <div class="case-intro"><b>Standard warehouse development flow:</b> define the business goal first, preserve source truth in ODS, build reusable facts and dimensions, aggregate by subject, and finally serve applications.</div>
      ${flowDiagram([
        "Define business goals & requirements",
        "Load raw data → ODS",
        "Transform into fact / dimension → DIL / DIM",
        "Aggregate by subject themes → DM",
        "Serve reporting & BI → ADS"
      ])}

      <div class="case-section-title">2. Enterprise Data Domains</div>
      <div class="card">
        <div class="q-head">
          <p class="q-title">Subject-oriented domain classification</p>
          ${listenBtn("The enterprise warehouse is organized into ten primary data domains: Customer, Product, Transaction, Event, Agreement, Finance, Capital, Asset, Relationship, and Address.")}
        </div>
        ${table(["No.","Topic","Code","Description"], [
          ["1","Customer","<span class='domain-code'>USR</span>","Covers individuals, merchants, and users, including profile, credit, education, and occupation information.<br>"],
          ["2","Product","<span class='domain-code'>PRD</span>","Covers products and services such as credit card repayment and red packets.<br>"],
          ["3","Transaction","<span class='domain-code'>TRD</span>","Covers the full order lifecycle from creation to payment, success, cancellation, and closure.<br>"],
          ["4","Event","<span class='domain-code'>EVT</span>","Covers risk events, campaigns, clickstream logs, and other operational events.<br>"],
          ["5","Agreement","<span class='domain-code'>AGT</span>","Covers contracts, agreements, and related terms.<br>"],
          ["6","Finance","<span class='domain-code'>FIN</span>","Covers finance-related analysis, such as reserve balances and available advance amounts.<br>"],
          ["7","Capital","<span class='domain-code'>CAP</span>","Covers balances, payments, transfers, purchases, and fund-flow analysis.<br>"],
          ["8","Asset","<span class='domain-code'>AST</span>","Covers fixed, long-term, and virtual assets such as houses and vehicles.<br>"],
          ["9","Relationship","<span class='domain-code'>REL</span>","Covers fund networks, social relationships, and relationship graph analysis.<br>"],
          ["10","Address","<span class='domain-code'>ADR</span>","Covers customer addresses, locations, latitude, and longitude.<br>"]
        ])}
      </div>

      <div class="card">
        <div class="q-head">
          <p class="q-title">Q: How do you classify a DM table when it combines user, order, and product data?</p>
          ${listenBtn("I classify the table by its main business subject, not by every source domain used in the join. I first check the table grain, then the core metrics, the main business question, and the team that owns the metric definition. Cross-domain joins are allowed, but the table should still have one clear primary domain.")}
        </div>
        <p class="q-desc"><b>A:</b> I classify the table by its <b>main business subject</b>, not by every source domain used in the join.</p>
        ${table(["Decision step","How to determine the primary domain"], [
          ["1. Check the grain","One row per user → <b>User</b>; one row per order → <b>Transaction / Order</b>; one row per product → <b>Product</b>."],
          ["2. Check core metrics","Identify what the table primarily measures."],
          ["3. Check the business question","Determine the main analytical question answered by the table."],
          ["4. Check ownership","Confirm which business process or team owns the metric definition."],
          ["5. Allow cross-domain joins","Joined sources may come from several domains, but the output should still have one clear primary domain."]
        ])}
        <div class="tip"><b>Example:</b> Grain = <b>user_id + date</b>; metrics = user GMV, purchase frequency, active status; purpose = analyse user behaviour → <b>Primary domain: User</b>, even when order and product data are joined.</div>
      </div>

      <div class="case-section-title">3. Business Case 2 — Cross-border E-commerce Collection</div>
    `,
    cards: [
      {letter:"S", title:"Situation", desc:"Chinese and Hong Kong cross-border sellers operate multiple Amazon stores across different countries. They cannot easily open overseas bank accounts, so they struggle to receive funds, withdraw money, and pay suppliers."},
      {letter:"T", title:"Task", desc:"Design a data warehouse solution that supports a Virtual Account architecture — giving each merchant a consolidated view while still tracking funds down to the individual store and currency level for compliance."},
      {letter:"A", title:"Action — the VA hierarchy", desc:"I designed a 3-level virtual account structure so real funds stay pooled, while internal ledgers track every merchant, store, and currency separately.",
        table: table(["Level","Example","Real bank account?","Purpose"], [
          ["Real Pool Account","Acct No: 328-999999-USD (JPM HK)","Yes","Provider's safeguarded settlement pool"],
          ["Merchant Main VA","MVA_12345 (Merchant A)","No — virtual","Merchant A's overall balance"],
          ["Sub-VA","MVA_12345_US_USD","No — virtual","Linked to Amazon US store"],
          ["Sub-VA","MVA_12345_EU_EUR","No — virtual","Linked to Amazon EU store"],
        ]),
      },
      {letter:"A", title:"Action — business process modeled", desc:"I modeled the full lifecycle so the warehouse could track a merchant from onboarding through to final payout.",
        flow:"Merchant Registration & KYC → Store Authorization & Binding → Sub-VA Activation → Amazon Payout → Main VA Settlement → Withdrawal / Supplier Payment"},
      {letter:"A", title:"Action — subject-oriented tables", desc:"I built three subject tables — Merchant, Store, and Order — each tracking horizontal attributes (like registration channel), a key time funnel (apply, authorize, bind, first settlement), and longitudinal metrics (cumulative and 28-day settlement volume).",
        table: table(["Subject","Tracks"], [

function dwCard(title, speakText, body, full=false) {
  return `<div class="dw-card${full ? ' full' : ''}">

      <h3>${title}</h3>
      ${listenBtn(speakText)}

}

  html += `</div>`;
  return html;
}

// TEXT-TO-SPEECH
// ============================================================
let voices = [];
let currentBtn = null;
const speechSupported = typeof window !== 'undefined' && 'speechSynthesis' in window;

function loadVoices() {
  if (!speechSupported) return;
  try {
    voices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
    const select = document.getElementById('voiceSelect');
    if (!select) return;
    select.innerHTML = '';
    if (voices.length === 0) { select.innerHTML = '<option>Default English voice</option>'; return; }
    voices.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${v.name} (${v.lang})`;
      if (v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('Google US English')) opt.selected = true;
      select.appendChild(opt);
    });
  } catch (e) { console.warn('Voice loading failed:', e); }
}
try { if (speechSupported) { window.speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); } } catch (e) { console.warn(e); }

const rateSlider = document.getElementById('rateSlider');
const rateLabel = document.getElementById('rateLabel');
if (rateSlider) rateSlider.addEventListener('input', () => { rateLabel.textContent = rateSlider.value + 'x'; });

function toggleSpeak(btn) {
  if (!speechSupported) { alert('Text-to-speech is not supported in this browser.'); return; }
  try {
    const text = decodeURIComponent(btn.dataset.text);
    if (btn.classList.contains('speaking')) { window.speechSynthesis.cancel(); btn.classList.remove('speaking'); currentBtn = null; return; }
    window.speechSynthesis.cancel();
    if (currentBtn) currentBtn.classList.remove('speaking');
    const utter = new SpeechSynthesisUtterance(text);
    const voiceIdx = document.getElementById('voiceSelect').value;
    if (voices[voiceIdx]) utter.voice = voices[voiceIdx];
    utter.lang = 'en-US';
    utter.rate = parseFloat(rateSlider.value);
    utter.onstart = () => { btn.classList.add('speaking'); currentBtn = btn; };
    utter.onend = () => { btn.classList.remove('speaking'); currentBtn = null; };
    utter.onerror = () => { btn.classList.remove('speaking'); currentBtn = null; };
    window.speechSynthesis.speak(utter);
  } catch (e) { console.warn('toggleSpeak failed:', e); }
}
const stopAllBtn = document.getElementById('stopAllBtn');
if (stopAllBtn) stopAllBtn.addEventListener('click', () => {
  if (speechSupported) window.speechSynthesis.cancel();
  document.querySelectorAll('.listen-btn.speaking').forEach(b => b.classList.remove('speaking'));
  currentBtn = null;
});
</script>
