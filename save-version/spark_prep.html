*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.58}.app{max-width:1120px;margin:auto;padding:24px 20px 80px}header h1{font-size:23px;margin:0 0 4px}header p{font-size:13.5px;color:var(--secondary);margin:0 0 16px}.voice-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:18px;position:sticky;top:8px;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.04)}.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:66px;background:var(--bg);z-index:15}.tab-btn{padding:9px 13px;font-size:12.5px;font-weight:600;color:var(--secondary);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}.panel{display:none}.panel.active{display:block}.intro,.head{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:16px;align-items:start}.intro{background:var(--accent-bg);color:var(--accent);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}.title{font-size:14.5px;font-weight:700;margin:0}.desc{font-size:13px;color:var(--secondary);margin:5px 0 8px}.answer{font-size:13px;color:var(--text);margin:5px 0 8px}.answer strong,.desc strong,td strong{color:#173f5f}.listen{justify-self:end;min-width:96px;border:1px solid var(--accent);background:var(--accent-bg);color:var(--accent);border-radius:999px;padding:6px 10px;cursor:pointer;font-weight:600}.listen.speaking{background:var(--accent);color:#fff}.flow{white-space:pre-wrap;font-family:Menlo,monospace;font-size:12px;background:var(--purple-bg);color:var(--purple);border-radius:8px;padding:9px 12px;margin:8px 0}.code{white-space:pre;overflow:auto;background:#F4F4F2;border-radius:8px;padding:11px 14px;font-family:Menlo,monospace;font-size:11.5px}.tip,.warn{font-size:12px;border-radius:6px;padding:7px 10px;margin-top:8px}.tip{color:var(--success);background:var(--success-bg)}.warn{color:var(--warn);background:var(--warn-bg)}table{border-collapse:collapse;width:100%;font-size:12px;margin:8px 0;display:block;overflow:auto}th,td{border:1px solid var(--border);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--accent-bg);color:var(--accent)}.qa{font-size:13px;color:var(--secondary);border-left:3px solid var(--accent);padding-left:12px;margin-top:5px}.subhead{font-size:16px;margin:22px 0 10px;color:var(--purple)}code{font-family:Menlo,monospace}.memory-diagram{margin:12px 0}.container-box{border:2px solid var(--purple);border-radius:10px;padding:10px;background:var(--purple-bg)}.heap-box{border:2px solid var(--accent);border-radius:8px;padding:9px;background:#fff}.memory-title{font-weight:700;font-size:12px;margin-bottom:7px}.memory-grid{display:grid;grid-template-columns:.7fr 1.2fr 3fr;gap:7px}.mem{padding:10px;border-radius:7px;font-size:11.5px}.reserved{background:#F1F1EF}.user{background:var(--warn-bg)}.unified{background:var(--accent-bg)}.unified-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.unified-grid>div{background:#fff;padding:7px;border-radius:5px;border:1px solid #cfe3f3}.borrow{text-align:center;margin-top:6px;font-weight:700;color:var(--accent)}.overhead-box{margin-top:8px;padding:9px;border-radius:7px;background:var(--danger-bg);color:var(--danger);font-size:11.5px}@media(max-width:720px){.intro,.head{grid-template-columns:1fr}.listen{justify-self:start}.tabs{top:108px}.memory-grid{grid-template-columns:1fr}.unified-grid{grid-template-columns:1fr}}
</style>

<div class="app">
<header><h1>Spark Interview Prep</h1><p>Core concepts, execution, performance optimization, memory diagnosis, and English read-aloud practice.</p></header>
<div class="voice-bar"><label>🔊 Voice: <select id="voice"></select></label><label>Speed: <input id="rate" type="range" min="0.7" max="1.2" step="0.05" value="0.92"></label><span id="rv">0.92x</span><button id="stop" class="listen" style="margin-left:auto">⏹ Stop</button></div>

<div id="core" class="panel active"></div><div id="exec" class="panel"></div><div id="catalyst" class="panel"></div><div id="performance" class="panel"></div><div id="memory" class="panel"></div><div id="mapreduce" class="panel"></div><div id="qa" class="panel"></div>

<script>
const data={"core": [{"title": "What is Apache Spark?", "speak": "Apache Spark is a distributed computing engine for large-scale data processing. It uses DAG-based execution and can keep reusable intermediate data in memory, which makes many iterative workloads faster than traditional MapReduce.", "desc": "A concise definition that highlights distribution, DAG execution, and in-memory processing.", "table": [["Capability", "Meaning"], ["Distributed engine", "Runs tasks across multiple worker nodes"], ["In-memory processing", "Can cache reusable data across stages"], ["DAG-based", "Optimizes multiple transformations as one execution graph"], ["APIs", "Python, Scala, Java, and SQL"]]}, {"title": "RDD", "speak": "An RDD is an immutable, partitioned, distributed collection and the low-level Spark API. It supports transformations such as map and filter, and key-based operations such as reduce by key.", "desc": "RDD stands for Resilient Distributed Dataset.", "tip": "RDDs provide control, but DataFrames usually offer better optimization and performance."}, {"title": "DataFrame", "speak": "A DataFrame is a distributed table with a schema. It is optimized by Catalyst and Tungsten, making it easier to use and generally faster than raw RDD code.", "desc": "Think of it as a distributed, optimized table rather than simply distributed Pandas."}, {"title": "Lazy Evaluation", "speak": "Spark records transformations and builds a DAG, but it does not execute them immediately. Execution begins only when an action such as count, collect, show, or save is called.", "desc": "Lazy evaluation allows Spark to optimize the whole pipeline before execution.", "flow": "Transformations → Logical DAG → Action → Execution"}, {"title": "Transformation vs Action", "speak": "A transformation lazily creates a new RDD or DataFrame, while an action triggers actual computation and returns or writes a result.", "desc": "This distinction explains when Spark actually starts a job.", "code": "Transformations: map, filter, select, groupBy\nActions:         count, collect, show, save"}], "exec": [{"title": "Job → Stage → Task", "speak": "An action triggers a job. The DAG scheduler splits the job into stages at shuffle boundaries. Each stage contains tasks, and each task processes one partition.", "desc": "The core execution hierarchy.", "flow": "Action → Job → Stage → Task → Executor", "table": [["Concept", "One-Line Answer", "Key Point"], ["Job", "Triggered by an action", "One action normally creates one job"], ["Stage", "Tasks between shuffle boundaries", "Wide transformations split stages"], ["Task", "Execution unit for one partition", "One partition equals one task"], ["Executor", "Runs tasks on worker nodes", "Parallelism is limited by executor cores"]]}, {"title": "Driver, DAGScheduler, and TaskScheduler", "speak": "The driver runs the application logic and coordinates execution. The DAG scheduler converts the DAG into stages, while the task scheduler assigns tasks to executors and manages retries and data locality.", "desc": "Know which component is responsible for planning versus task placement.", "code": "Driver        — runs main logic and coordinates the application\nDAGScheduler   — splits jobs into stages at shuffle boundaries\nTaskScheduler  — assigns tasks to executors and manages retries\nExecutor       — executes tasks and stores cached or shuffle data"}, {"title": "Input Partitions vs Shuffle Partitions", "speak": "Initial partitions are mainly determined by the data source, file layout, block size, and split settings. Spark SQL shuffle partitions controls the number of output partitions after shuffle operations such as joins and aggregations.", "desc": "Do not confuse file-read parallelism with post-shuffle parallelism.", "flow": "Read partitions ≠ spark.sql.shuffle.partitions", "table": [["Phase", "Partition Control"], ["File read", "Source splits, block size, file format, max partition bytes"], ["Narrow transformations", "Usually preserve or locally transform existing partitions"], ["Shuffle output", "spark.sql.shuffle.partitions, unless AQE changes it at runtime"]]}], "catalyst": [{"title": "Catalyst Optimizer Pipeline", "speak": "Catalyst parses SQL or DataFrame code into a logical plan, resolves columns and types into an analyzed plan, applies optimization rules to create an optimized plan, and then selects physical operators for execution.", "desc": "The four stages to remember.", "flow": "Logical Plan → Analyzed Plan → Optimized Plan → Physical Plan", "table": [["Stage", "What Happens"], ["Logical Plan", "Parse SQL or DataFrame operations into an unresolved tree"], ["Analyzed Plan", "Resolve columns, tables, functions, and data types"], ["Optimized Plan", "Apply predicate pushdown, column pruning, constant folding, and join reordering"], ["Physical Plan", "Choose operators such as BroadcastHashJoin, SortMergeJoin, HashAggregate, or SortAggregate"]]}, {"title": "Common Catalyst Optimizations", "speak": "Predicate pushdown filters data as early as possible, column pruning reads only required columns, constant folding precomputes constant expressions, and join reordering selects a more efficient join order.", "desc": "Mention these when explaining why DataFrame and SQL workloads are usually preferred.", "code": "Predicate Pushdown — reduce rows early\nColumn Pruning    — read only required columns\nConstant Folding  — precompute constant expressions\nJoin Reordering   — choose a more efficient join order"}, {"title": "How to Inspect the Plan", "speak": "Use explain to inspect logical and physical plans. Focus on expensive operators such as exchanges, sort merge joins, hash aggregates, and large scans.", "desc": "Execution plans connect SQL logic with runtime behavior.", "code": "df.explain(\"formatted\")\n\n-- SQL\nEXPLAIN FORMATTED\nSELECT ..."}], "performance": [{"title": "What is Shuffle?", "speak": "Shuffle is the redistribution of data across partitions. It is expensive because it involves serialization, network transfer, disk writes, and disk reads.", "desc": "Shuffle is often the main performance boundary in Spark.", "table": [["Type", "Relationship", "Examples"], ["Narrow transformation", "Each parent partition contributes to one child partition", "map, filter, union"], ["Wide transformation", "Parent partitions contribute to multiple child partitions", "groupBy, join, reduceByKey"]], "tip": "If records must move to a different partition based on key, a shuffle is required."}, {"title": "What is Data Skew?", "speak": "Data skew means records are distributed unevenly across partitions. A hot key can create one extremely large partition, causing long-tail tasks, spills, garbage collection pressure, or executor out-of-memory errors.", "desc": "Skew is a data-distribution problem, not merely a resource-allocation problem.", "table": [["Skew Type", "Cause", "Common Solution"], ["Input files", "Many tiny files or one oversized file", "Compaction, repartitioning, better file sizing"], ["Join keys", "A hot key appears millions of times", "Broadcast join, salting, AQE skew join handling"], ["Aggregation keys", "One key dominates GROUP BY", "Two-stage aggregation and targeted salting"], ["General imbalance", "Uneven partition sizes", "AQE and shuffle-partition tuning"]], "table2": [["Symptom", "Likely Meaning"], ["One task runs much longer", "Hot partition or skew"], ["Executor OOM", "Oversized aggregation or join state"], ["High shuffle read time", "Network and disk I/O bottleneck"], ["Long GC pauses", "Memory pressure"]]}, {"title": "Why Shuffle Read Becomes the Bottleneck", "speak": "Reduce-side tasks fetch shuffle files written by map-side tasks. Under skew, one reducer may fetch far more data than the others, so shuffle read time dominates while CPU utilization remains relatively low.", "desc": "This explains why the job can be slow even when the computation itself is simple.", "tip": "Compare shuffle read time, task CPU time, partition size, spill metrics, and task-duration distribution in the Spark UI."}, {"title": "Two-Stage Aggregation", "speak": "Two-stage aggregation first reduces cardinality or deduplicates at a finer-grained key, and then performs the final aggregation. This replaces one giant aggregation state with many smaller and more manageable groups.", "desc": "Especially useful for skewed count distinct or high-cardinality aggregation.", "table": [["", "Single-Stage", "Two-Stage"], ["Memory model", "One giant HashSet per hot group", "Many smaller groups"], ["Spill behavior", "Often difficult for exact distinct state", "More manageable intermediate groups"], ["OOM risk", "High under extreme skew", "Lower"], ["Operational behavior", "Fast on small balanced data", "Stable on large skewed data"]], "code": "-- Stage 1: deduplicate the distinct key\nSELECT key, sender_id\nFROM source\nGROUP BY key, sender_id;\n\n-- Stage 2: count deduplicated rows\nSELECT key, COUNT(*)\nFROM stage1\nGROUP BY key;", "tip": "Production example: combined with targeted salting and AQE, runtime improved from 75 minutes to 13 minutes."}, {"title": "Salting for Skewed Aggregation", "speak": "For a skewed aggregation, add a deterministic salt derived from the distinct key, distribute the hot key across several reducers, aggregate within each bucket, and then merge the partial results.", "desc": "Deterministic salting preserves distinct semantics.", "code": "salt = hash(sender_id) % 8\n\nStage 1: GROUP BY key, salt, sender_id\nStage 2: GROUP BY key, sender_id\nStage 3: GROUP BY key → COUNT(*)", "warn": "For COUNT DISTINCT, do not use a different random salt for duplicate copies of the same distinct value, or the final count can be wrong."}, {"title": "Salting for a Skewed Join", "speak": "For join skew, assign each large-table row to a salt bucket and replicate the matching small-table rows across all salt values. Join on the salted key, then remove the salt after the join.", "desc": "The small side is expanded so every large-side bucket has a matching key.", "code": "WITH salted_large AS (\n  SELECT CONCAT(CAST(FLOOR(RAND() * 10) AS STRING), '_', join_key) AS salted_key,\n         some_value\n  FROM large_table\n),\nsalt_values AS (\n  SELECT 0 AS salt UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3\n  UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6\n  UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9\n),\nsalted_small AS (\n  SELECT CONCAT(CAST(s.salt AS STRING), '_', t.join_key) AS salted_key,\n         t.other_value\n  FROM small_table t\n  CROSS JOIN salt_values s\n)\nSELECT *\nFROM salted_large l\nJOIN salted_small r ON l.salted_key = r.salted_key;", "tip": "Random salting can be valid for join distribution because each large-side row belongs to one bucket and the small side is replicated across all buckets."}, {"title": "HashAggregate vs SortAggregate", "speak": "Hash aggregate is usually faster when aggregation state fits in memory, but it can create high memory pressure. Sort aggregate is more stable for large or skewed workloads because sorted data and spill behavior can reduce peak memory pressure.", "desc": "Use the execution plan and runtime metrics to understand which operator Spark selected.", "table": [["", "HashAggregate", "SortAggregate"], ["Primary structure", "In-memory hash map or hash set", "Sorted stream of grouped rows"], ["Memory pressure", "Potentially high", "Typically more controlled"], ["Performance", "Fast when state fits in memory", "More stable for large or skewed groups"], ["Risk", "OOM under extreme cardinality or skew", "Extra sort and spill overhead"]]}, {"title": "AQE — Adaptive Query Execution", "speak": "Adaptive Query Execution uses runtime statistics to coalesce small shuffle partitions, split skewed join partitions, and change join strategies when the actual data size differs from the original estimate.", "desc": "AQE improves plans after shuffle statistics become available.", "table": [["AQE Function", "What It Does", "Benefit"], ["Coalesce partitions", "Merges small shuffle partitions", "Reduces tiny-task overhead"], ["Skew join split", "Splits oversized join partitions", "Reduces long-tail tasks"], ["Switch join strategy", "Can change SortMergeJoin to BroadcastHashJoin", "Avoids unnecessary shuffle"]], "warn": "AQE cannot always solve one extreme hot key in an aggregation. Manual salting or query redesign may still be necessary."}, {"title": "AQE vs Manual Salting", "speak": "AQE is automatic and reacts at runtime, while manual salting rewrites the data distribution before the shuffle. AQE works well for moderate skew, but known extreme keys often require targeted salting.", "desc": "Use both when necessary; they solve skew at different stages.", "table": [["", "AQE", "Salting"], ["Timing", "Runtime, after statistics are available", "Before or during logical query rewrite"], ["Implementation", "Automatic", "Manual"], ["Best for", "Moderate or unpredictable skew", "Known extreme hot keys"], ["Main limitation", "May not rebalance one extreme aggregation key", "Requires careful correctness design"]]}, {"title": "Join Strategies", "speak": "Broadcast hash join sends a small table to every executor and avoids shuffling the large table. Sort merge join shuffles and sorts both large sides. Shuffle hash join shuffles both sides and builds an in-memory hash table for the smaller side of each partition.", "desc": "Choose the strategy based on data size, memory, and statistics.", "table": [["Strategy", "When to Use", "How It Works"], ["BroadcastHashJoin", "One side is small enough to broadcast", "Replicate small side; avoid large-side shuffle"], ["SortMergeJoin", "Both sides are large and sortable", "Shuffle and sort both sides, then merge"], ["ShuffleHashJoin", "Smaller partitioned side fits in memory", "Shuffle both sides, hash the smaller side"]], "tip": "The 10 MB broadcast threshold is only a common default; always check your Spark version and configuration."}], "memory": [{"title": "🌱 Level 1 — Driver vs Executor", "speak": "The driver is the brain that plans and coordinates the job. Executors are the workers that run tasks, process partitions, hold cached data, and report results back to the driver.", "desc": "中文：Driver 是负责规划和协调任务的“大脑”，Executor 是真正执行 Task、处理数据的“肌肉”。", "table": [["Process", "Runs Where", "Responsibility"], ["Driver", "One per application; in cluster mode it runs inside the application container, while in client mode it runs on the client machine.", "Builds the DAG, creates jobs and stages, schedules tasks, and receives results."], ["Executor", "Multiple processes distributed across worker nodes.", "Runs tasks, stores cached and shuffle data, performs joins and aggregations, and reports status to the Driver."]], "tip": "Interview trap: Driver OOM and Executor OOM are different incidents with different root causes and fixes."}, {"title": "🧠 Level 2 — Executor memory layout", "speak": "An executor JVM heap is not one undivided pool. Spark reserves a small region, leaves user memory for application objects and user-defined functions, and uses Unified Memory for execution and storage. Execution and storage can borrow space from each other, although execution may evict cached storage blocks.", "desc": "中文：Executor 的 JVM Heap 不是一整块内存；它包含 Reserved Memory、User Memory，以及可动态共享的 Execution / Storage Unified Memory。", "html": "\n<div class=\"memory-diagram\">\n  <div class=\"container-box\">\n    <div class=\"memory-title\">Container / Pod Total Memory</div>\n    <div class=\"heap-box\">\n      <div class=\"memory-title\">JVM Heap — <code>spark.executor.memory</code></div>\n      <div class=\"memory-grid\">\n        <div class=\"mem reserved\"><strong>Reserved Memory</strong><br>约 300 MB</div>\n        <div class=\"mem user\"><strong>User Memory</strong><br>UDF、用户对象、元数据</div>\n        <div class=\"mem unified\">\n          <strong>Unified Memory</strong><br><code>spark.memory.fraction</code>\n          <div class=\"unified-grid\">\n            <div><strong>Execution</strong><br>Shuffle / Join / Sort / Aggregation</div>\n            <div><strong>Storage</strong><br>Cached RDD / DataFrame / Broadcast</div>\n          </div>\n          <div class=\"borrow\">↔ Execution 和 Storage 可动态借用</div>\n        </div>\n      </div>\n    </div>\n    <div class=\"overhead-box\"><strong>Off-heap / Memory Overhead</strong><br>\n      Network buffers、JVM thread stacks、native libraries、Python worker memory 等\n    </div>\n  </div>\n</div>\n", "code": "spark.executor.memory\nspark.executor.memoryOverhead\nspark.memory.fraction\nspark.memory.storageFraction", "tip": "A large executor heap does not protect the application from container-level OOM when off-heap or Python-process memory exceeds memoryOverhead."}, {"title": "Execution Memory vs Storage Memory", "speak": "Execution memory is used by shuffle, joins, sorting, and aggregation. Storage memory holds cached blocks and broadcast variables. Under Unified Memory, the two regions share space dynamically, but execution has stronger eviction rights because a running task must make progress.", "desc": "中文：Execution Memory 用于计算过程；Storage Memory 用于缓存。两者可以互相借用，但执行内存通常可以驱逐缓存。", "table": [["Region", "Typical Usage", "Pressure Symptom"], ["Execution Memory", "Shuffle buffers, join hash tables, sorting, aggregation state", "Spill, long GC, task OOM"], ["Storage Memory", "Cached RDD/DataFrame blocks, broadcast data", "Cached blocks are evicted and recomputed"], ["User Memory", "User objects, UDF state, internal metadata", "Heap pressure that Unified Memory tuning may not solve"], ["Overhead / Off-heap", "Network/native buffers, thread stacks, Python workers", "Container killed or Pod OOMKilled"]]}, {"title": "YARN vs Kubernetes — same Spark model, different enforcement", "speak": "Spark uses the same heap, Unified Memory, and overhead concepts on YARN and Kubernetes. The difference is the outer container enforcement. YARN NodeManager monitors the container and kills it when total usage exceeds the allocation. Kubernetes uses cgroups and kubelet, and the Pod normally reports OOMKilled.", "desc": "中文：Spark 内部内存模型相同；差别在于谁执行容器总内存限制，以及超限后出现什么报错。", "table": [["Platform", "Limit Enforcement", "Typical Failure", "Investigation"], ["YARN", "NodeManager monitors the container process tree", "Container killed by YARN for exceeding memory limits", "yarn logs / NodeManager logs"], ["Kubernetes", "Linux cgroups enforced by kubelet and container runtime", "Pod status: OOMKilled; exit code commonly 137", "kubectl describe pod / kubectl logs"]], "tip": "On both platforms, review total process memory—not only JVM heap. Python workers and native allocations may also consume overhead."}, {"title": "💥 Level 3 — Driver OOM vs Executor OOM", "speak": "Driver OOM commonly comes from collecting too much data, converting a large dataset to Pandas, or creating oversized driver-side objects. Executor OOM commonly comes from skew, oversized partitions, large join or aggregation state, excessive caching, or insufficient overhead.", "desc": "中文：虽然都可能显示 OutOfMemoryError，但 Driver OOM 和 Executor OOM 的位置、根因及修复方式完全不同。", "table": [["Dimension", "Driver OOM", "Executor OOM"], ["Typical causes", "collect, toPandas, large local objects, oversized result collection", "Skew, large partitions, join/aggregation state, cache pressure, overhead shortage"], ["Where observed", "Driver logs; application may terminate directly", "Executor loss, task retry, repeated stage failures"], ["Primary fix", "Avoid pulling full data to Driver; redesign result handling", "Fix partitioning/skew; reduce state; tune memory only after diagnosis"], ["Memory config", "spark.driver.memory / driver overhead", "spark.executor.memory / memoryOverhead"]], "warn": "A senior answer should identify the failed process and memory region before saying 'increase memory'."}, {"title": "Reading Spark OOM messages", "speak": "Java heap space means the JVM heap is exhausted. GC overhead limit exceeded means the JVM spends almost all its time collecting garbage with little progress. A YARN container memory-limit message or Kubernetes OOMKilled status usually indicates total container memory exceeded its limit, which may involve off-heap or child-process memory.", "desc": "中文：报错文字通常可以帮助你判断是 JVM Heap、GC 压力，还是容器总内存超限。", "table": [["Error Text", "Likely Meaning", "First Direction"], ["java.lang.OutOfMemoryError: Java heap space", "JVM heap exhausted", "Find oversized objects/state; then review heap sizing"], ["GC overhead limit exceeded", "Almost all time is spent in GC with little reclaimed memory", "Reduce working set and object churn; inspect skew"], ["Container killed by YARN for exceeding memory limits", "Total process-tree memory exceeded YARN allocation", "Inspect memoryOverhead, Python/native memory, and process tree"], ["Pod status: OOMKilled", "The cgroup memory limit was exceeded", "Inspect Pod limit, executor overhead, and child processes"]]}, {"title": "Why COUNT(DISTINCT) under skew can cause Executor OOM", "speak": "A shuffle sends all rows for one grouping key to the same reduce-side partition. Exact count distinct may maintain a very large set of seen values for a hot key. When that state becomes too large, the executor experiences severe memory pressure or OOM. Two-stage deduplication and deterministic salting reduce the size handled by each task.", "desc": "中文：Hot Key 会让单个 Task 维护巨大的去重状态；两阶段聚合与确定性加盐把状态拆散。", "flow": "Hot key → One large reduce partition → Huge distinct state → GC / OOM", "code": "Stage 1: GROUP BY key, sender_id\nStage 2: GROUP BY key → COUNT(*)\n\nExtreme hot key:\nsalt = hash(sender_id) % N\naggregate by key + salt first, then merge", "tip": "Avoid an absolute claim that every HashAggregate distinct state can never spill. Explain the practical issue: exact distinct state under extreme skew can become too large and memory-intensive."}], "mapreduce": [{"title": "Spark vs MapReduce — the interview answer", "speak": "Spark uses a DAG of stages and supports in-memory caching, while MapReduce uses a fixed map and reduce execution model and normally materializes intermediate results to disk between jobs. Spark is especially strong for iterative analytics, interactive SQL, streaming, and machine learning.", "desc": "Start with execution model and intermediate-data handling, then discuss workload fit.", "table": [["Aspect", "Spark", "MapReduce"], ["Execution model", "DAG containing multiple stages", "Fixed Map → Reduce phases for each job"], ["Intermediate data", "Can remain cached in memory; spills when required", "Usually written to disk between jobs"], ["Pipeline behavior", "Pipelines compatible narrow transformations", "Materializes boundaries between jobs"], ["Shuffle", "Sort-based shuffle with AQE and other optimizations", "Disk-heavy shuffle and full sort"], ["Latency", "Suited to interactive and iterative processing", "Suited to high-throughput batch processing"], ["Fault tolerance", "Lineage recomputes lost partitions", "Retries tasks using materialized data"], ["Typical workloads", "SQL, ETL, ML, streaming, iterative analytics", "Large, straightforward batch jobs"]], "tip": "Do not say that Spark never writes to disk. Spark still spills and writes shuffle data when necessary."}, {"title": "Why Spark is often faster", "speak": "Spark can pipeline narrow transformations in one stage and reuse cached datasets across multiple operations. This reduces repeated disk input and output, especially for iterative algorithms and interactive analysis.", "desc": "The advantage is workload-dependent, not an absolute guarantee.", "flow": "MapReduce: Map → Disk → Reduce → HDFS → Next Job\nSpark: Transformations → Pipelined Stage → Optional Cache → Reuse", "warn": "For a simple one-pass batch workload, Spark may not always be dramatically faster once startup and resource overhead are considered."}, {"title": "Memory and shuffle differences", "speak": "Spark can retain reusable intermediate data in memory, but shuffle data still involves serialization, network transfer, and often disk. MapReduce normally persists intermediate output to disk between its fixed phases.", "desc": "This is the accurate answer to the common 'Spark is memory and MapReduce is disk' simplification.", "table": [["Question", "Accurate Answer"], ["Does Spark always stay in memory?", "No. It can cache in memory, but it spills and writes shuffle files when needed."], ["Does MapReduce always use only disk?", "Its intermediate workflow is fundamentally disk-materialized between jobs."], ["Why does Spark help iterative jobs?", "The same dataset can be cached and reused without re-reading it for every iteration."]]}], "qa": {"quick": [["What is Spark?", "A distributed, DAG-based computing engine for large-scale data processing, with in-memory caching support."], ["What is shuffle?", "Data redistribution across partitions. It is expensive because of serialization, network transfer, and disk I/O."], ["What is data skew?", "Uneven data distribution across partitions, causing long-tail tasks, spills, or executor OOM."], ["How did you solve skew?", "I used two-stage aggregation, targeted salting, and AQE, reducing runtime from 75 minutes to 13 minutes."], ["What is AQE?", "Runtime optimization that coalesces small shuffle partitions, handles skewed joins, and can switch join strategies."], ["HashAgg vs SortAgg?", "HashAgg is fast when state fits in memory; SortAgg is usually more stable for large or skewed groups."], ["What is lazy evaluation?", "Transformations build a DAG, and execution starts only when an action is called."], ["What is Catalyst?", "Spark SQL's optimizer, converting a logical plan into an optimized physical execution plan."], ["What is one partition?", "A logical data slice processed by one task at a time."], ["Why is shuffle read high under skew?", "One reducer fetches a disproportionate amount of shuffle data, making network and disk I/O the bottleneck."]], "deep": [{"title": "Q1: What determines the number of partitions after Spark reads data?", "speak": "The initial partition count mainly depends on the data source, file size, block size, file splits, and reader settings. Spark SQL shuffle partitions applies after wide operations such as joins and aggregations, not to the initial file read.", "desc": "Use this answer to separate input parallelism from shuffle parallelism.", "table": [["Phase", "Partition Control"], ["File read", "Source splits, block size, file format, max partition bytes"], ["Narrow transformations", "Usually preserve or locally transform existing partitions"], ["Shuffle output", "spark.sql.shuffle.partitions, unless AQE changes it at runtime"]]}, {"title": "Q2: Is setting spark.sql.shuffle.partitions to 200 meaningful?", "speak": "It can be meaningful, but only in context. Two hundred may be too high for a small dataset and too low for a large shuffle. Choose a value based on shuffle size, target partition size, available executor cores, and AQE behavior.", "desc": "Avoid treating 200 as a universally correct value.", "tip": "A practical goal is enough partitions to use available cores without creating thousands of tiny tasks."}, {"title": "Q4: How do you troubleshoot Spark performance problems?", "speak": "I start with the Spark UI to locate the slow job and stage, inspect task-duration distribution and shuffle metrics, review the SQL and DAG, examine the physical plan with explain, and then query the underlying data to confirm skewed keys or abnormal cardinality.", "desc": "A structured production troubleshooting method.", "table": [["Step", "What to Inspect"], ["1. Spark UI", "Slow jobs, stages, long-tail tasks"], ["2. Stage metrics", "Shuffle read and write, spills, GC, input size"], ["3. SQL and DAG", "Wide transformations and repeated scans"], ["4. Physical plan", "Exchange, HashAggregate, SortAggregate, SortMergeJoin"], ["5. Data profile", "Hot keys, null-heavy keys, high cardinality, file-size imbalance"]], "tip": "Always distinguish data problems, query-plan problems, and resource problems before changing executor memory."}, {"title": "Q5: How do you explain your production skew incident?", "speak": "A critical aggregation job suffered executor out-of-memory failures and a 75-minute runtime because one hot key created an oversized aggregation state. I confirmed the skew through Spark UI task metrics and key-frequency analysis, then applied two-stage aggregation, targeted deterministic salting, and AQE. Runtime dropped to 13 minutes and the job became stable.", "desc": "A concise STAR-style technical story.", "flow": "Symptom → Spark UI → Root Cause → Query Rewrite → Validation → 75 min to 13 min"}, {"title": "Q6: When should you broadcast a table?", "speak": "Broadcast a table when it is small enough to fit safely in executor memory and broadcasting it avoids a much larger shuffle. Validate the actual size, memory headroom, and number of concurrent tasks rather than relying only on row count.", "desc": "Mention memory safety and statistics, not only the default threshold."}, {"title": "Q: Why can an executor still be killed after increasing spark.executor.memory?", "speak": "Because executor memory controls the JVM heap, while the container or Pod also includes memory overhead and possibly Python or native processes. If total memory exceeds the outer limit, YARN or Kubernetes can still kill the executor.", "desc": "Mention heap versus total container memory.", "tip": "Check the exact message: Java heap space and container-limit failure point to different regions."}, {"title": "Q: How do you distinguish a resource problem from a skew problem?", "speak": "A resource problem tends to affect many tasks similarly, while skew usually creates a long tail where one or a few tasks process much more data. I compare task duration, input size, shuffle read, spill, and key-frequency distribution before changing resources.", "desc": "This answer prevents blind memory tuning."}]}};
const intros={"core": "Use these concise definitions to establish a strong Spark foundation.", "exec": "Explain how the Driver converts an action into jobs, stages, and tasks executed over partitions.", "catalyst": "Catalyst converts SQL or DataFrame logic into an optimized physical execution plan.", "performance": "This tab connects shuffle, skew, salting, AQE, aggregation operators, and join strategies as one performance story.", "memory": "Name the exact process and memory region before proposing a fix for an OOM.", "mapreduce": "Compare Spark and MapReduce accurately: execution model, intermediate-data handling, shuffle, and workload fit.", "qa": "Start with the concise answer, then expand with the deep-dive cards when the interviewer asks follow-up questions."};

const KEYWORDS=[
"immutable","partitioned","distributed collection","distributed computing engine","DAG-based execution",
"in-memory","low-level Spark API","DataFrame","Catalyst","Tungsten","lazy evaluation","transformation","action",
"Job","Stage","Task","Executor","Driver","DAGScheduler","TaskScheduler","shuffle boundaries","one partition",
"Logical Plan","Analyzed Plan","Optimized Plan","Physical Plan","predicate pushdown","column pruning","constant folding",
"join reordering","Shuffle","data skew","hot key","long-tail tasks","Shuffle Read","two-stage aggregation",
"deterministic salt","salting","HashAggregate","SortAggregate","AQE","Adaptive Query Execution",
"BroadcastHashJoin","SortMergeJoin","ShuffleHashJoin","Execution Memory","Storage Memory","User Memory",
"Unified Memory","Reserved Memory","memory overhead","off-heap","Java heap space","GC overhead limit exceeded",
"OOMKilled","Driver OOM","Executor OOM","COUNT(DISTINCT)","MapReduce","RDD lineage","spill"
].sort((a,b)=>b.length-a.length);

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function highlight(s){
 let out=esc(s);
 for(const k of KEYWORDS){
   const escaped=k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
   out=out.replace(new RegExp(`\\b(${escaped})\\b`,"gi"),"<strong>$1</strong>");
 }
 return out;
}
const btn=t=>`<button class="listen" data-speak="${encodeURIComponent(t)}">🔊 Listen</button>`;
function tbl(rows){
 return "<table><thead><tr>"+rows[0].map(x=>`<th>${highlight(x)}</th>`).join("")+
 "</tr></thead><tbody>"+rows.slice(1).map(r=>"<tr>"+r.map(x=>`<td>${highlight(x)}</td>`).join("")+"</tr>").join("")+"</tbody></table>";
}
function card(x){
 let h=`<div class="card"><div class="head"><p class="title">${highlight(x.title)}</p>${btn(x.speak)}</div><p class="answer">${highlight(x.speak)}</p>`;
 if(x.desc)h+=`<p class="desc">${highlight(x.desc)}</p>`;
 if(x.flow)h+=`<div class="flow">${highlight(x.flow)}</div>`;
 if(x.table)h+=tbl(x.table);
 if(x.table2)h+=tbl(x.table2);
 if(x.html)h+=x.html;
 if(x.code)h+=`<div class="code">${esc(x.code)}</div>`;
 if(x.tip)h+=`<div class="tip">💡 ${highlight(x.tip)}</div>`;
 if(x.warn)h+=`<div class="warn">⚠️ ${highlight(x.warn)}</div>`;
 return h+"</div>";
}
function intro(id){return `<div class="intro"><div>${highlight(intros[id])}</div>${btn(intros[id])}</div>`}
for(const id of ["core","exec","catalyst","performance","memory","mapreduce"]){
 document.getElementById(id).innerHTML=intro(id)+data[id].map(card).join("");
}
document.getElementById("qa").innerHTML=
 intro("qa")+"<h2 class='subhead'>⚡ Quick Answers</h2>"+
 data.qa.quick.map(([q,a])=>`<div class="card"><div class="head"><p class="title">${highlight(q)}</p>${btn(a)}</div><div class="qa">${highlight(a)}</div></div>`).join("")+
 "<h2 class='subhead'>🔍 Deep-Dive Q&A</h2>"+data.qa.deep.map(card).join("");

document.querySelectorAll(".tab-btn").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");document.getElementById(b.dataset.tab).classList.add("active");
});

let voices=[],active=null;const synth=window.speechSynthesis,sel=document.getElementById("voice"),rate=document.getElementById("rate"),rv=document.getElementById("rv");
function load(){voices=synth.getVoices().filter(v=>v.lang.toLowerCase().startsWith("en"));sel.innerHTML="";voices.forEach((v,i)=>{const o=document.createElement("option");o.value=i;o.textContent=`${v.name} (${v.lang})`;sel.appendChild(o)});let i=voices.findIndex(v=>v.name.toLowerCase()==="google uk english female");if(i<0)i=voices.findIndex(v=>v.lang.toLowerCase().startsWith("en-gb"));if(i>=0)sel.value=i}
load();synth.onvoiceschanged=load;rate.oninput=()=>rv.textContent=rate.value+"x";
function reset(){document.querySelectorAll(".listen.speaking").forEach(b=>b.classList.remove("speaking"));active=null}
document.addEventListener("click",e=>{const b=e.target.closest("[data-speak]");if(!b)return;if(active===b){synth.cancel();reset();return} synth.cancel();reset();const u=new SpeechSynthesisUtterance(decodeURIComponent(b.dataset.speak));if(voices[sel.value])u.voice=voices[sel.value];u.lang="en-GB";u.rate=parseFloat(rate.value);u.onstart=()=>{b.classList.add("speaking");active=b};u.onend=reset;u.onerror=reset;synth.speak(u)});
document.getElementById("stop").onclick=()=>{synth.cancel();reset()};
</script>
</body>
